<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password | REVEX</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/cards.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="container"><nav class="nav"><a class="brand" href="index.html">REV<span>EX</span></a><div class="nav-actions"><a href="login.html">Log in</a></div></nav></header>
<main class="container" style="max-width:510px;padding:60px 0">
<section class="booking-panel"><span class="eyebrow">NEW PASSWORD</span>
<h1 class="section-title">Reset password</h1>
<div id="rpMsg" class="notice"></div>
<form id="rpForm">
<div class="field"><label>Reset token</label><input name="token" required placeholder="Paste token from reset link"></div>
<div class="field"><label>New password (min 8 chars)</label><input name="password" type="password" minlength="8" required></div>
<button class="btn btn-primary" style="width:100%;margin-top:16px">Reset password</button></form>
<p><a href="login.html">Back to login</a></p>
</section></main>
<script src="js/main.js"></script>
<script>
const t=new URLSearchParams(location.search).get('token');
if(t){ document.querySelector('[name=token]').value=t; }
document.getElementById('rpForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=document.getElementById('rpMsg');
  try{
    const d=await api('/auth/reset-password',{method:'POST',body:JSON.stringify({token:e.target.token.value.trim(),newPassword:e.target.password.value})});
    msg.textContent=d.message+' Redirecting to login...'; msg.style.display='block';
    setTimeout(()=>location.href='login.html',1200);
  }catch(err){ msg.textContent=err.message; msg.style.display='block'; }
});
</script>
</body>
</html>
