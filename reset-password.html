<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | REVEX</title>
  <script>(function(){try{var s=localStorage.getItem('revexTheme');document.documentElement.setAttribute('data-theme',s==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body class="auth-page">
  <header class="container">
    <nav class="nav">
      <a class="brand" href="index.html">REV<span>EX</span></a>
      <button class="theme-toggle theme-name" type="button" aria-pressed="false" aria-label="Switch between dark and light mode">
        <span class="track"><span class="thumb"></span></span><span class="icon"></span><span class="label"></span>
      </button>
    </nav>
  </header>

  <main class="container auth-shell">
    <aside class="auth-visual" aria-label="Choose a new password">
      <span class="eyebrow">SECURE YOUR ACCOUNT</span>
      <h2>Choose a strong new password.</h2>
      <p>Once saved, the reset token is destroyed and every future login uses your new password.</p>
      <div class="auth-points">
        <div class="auth-point"><span>✓</span>Minimum 8 characters</div>
        <div class="auth-point"><span>↗</span>Stored with bcrypt hashing</div>
        <div class="auth-point"><span>⌁</span>Token invalidated after use</div>
      </div>
    </aside>

    <section class="booking-panel auth-card">
      <span class="eyebrow">NEW PASSWORD</span>
      <h1 class="section-title">Reset password</h1>
      <div id="rpMsg" class="notice" role="status"></div>
      <form id="rpForm" novalidate>
        <div class="field"><label for="rpToken">Reset token</label><input id="rpToken" name="token" required placeholder="Paste token from reset link" autocomplete="off"></div>
        <div class="field"><label for="rpPassword">New password (min 8 chars)</label><input id="rpPassword" name="password" type="password" minlength="8" required autocomplete="new-password"></div>
        <div class="field"><label for="rpConfirm">Confirm new password</label><input id="rpConfirm" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password"></div>
        <button class="btn btn-primary" type="submit" style="width:100%;margin-top:16px">Reset password</button>
      </form>
      <p><a class="accent-link" href="login.html">Back to login</a></p>
    </section>
  </main>

  <script src="js/theme.js"></script>
  <script src="js/main.js"></script>
  <script>
    const presetToken = new URLSearchParams(location.search).get('token');
    if (presetToken) document.getElementById('rpToken').value = presetToken;

    document.getElementById('rpForm')?.addEventListener('submit', async event => {
      event.preventDefault();
      const form = event.target;
      const msg = document.getElementById('rpMsg');
      const submit = form.querySelector('button[type="submit"]');
      const token = form.token.value.trim();
      const newPassword = form.password.value;
      const confirmPassword = form.confirmPassword.value;

      const fail = message => { msg.textContent = message; msg.className = 'notice notice-error'; };
      msg.className = 'notice'; msg.textContent = 'Working…';

      if (newPassword !== confirmPassword) return fail('Passwords do not match.');
      if (newPassword.length < 8) return fail('Password must be at least 8 characters.');
      if (!token) return fail('Paste the reset token from your reset link.');

      submit.disabled = true;
      try {
        const data = await api('/auth/reset-password', { method: 'POST', body: { token, newPassword, confirmPassword } });
        msg.textContent = `${data.message} Redirecting to login…`;
        setTimeout(() => { location.href = 'login.html'; }, 1200);
      } catch (error) {
        fail(error.message);
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
