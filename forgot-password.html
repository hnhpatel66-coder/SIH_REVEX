<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forgot Password | REVEX</title>
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/cards.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<header class="container"><nav class="nav"><a class="brand" href="index.html">REV<span>EX</span></a><div class="nav-actions"><a href="login.html">Log in</a></div></nav></header>
<main class="container" style="max-width:510px;padding:60px 0">
<section class="booking-panel"><span class="eyebrow">RESET ACCESS</span>
<h1 class="section-title">Forgot password</h1>
<p>Enter your account email. If it exists, a reset link is generated.</p>
<div id="fpMsg" class="notice"></div>
<form id="fpForm"><div class="field"><label>Email</label><input name="email" type="email" required placeholder="you@example.com"></div>
<button class="btn btn-primary" style="width:100%;margin-top:16px">Send reset link</button></form>
<div id="fpLink" style="margin-top:14px"></div>
<p><a href="login.html">Back to login</a></p>
</section></main>
<script src="js/main.js"></script>
<script>
document.getElementById('fpForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const msg=document.getElementById('fpMsg'), link=document.getElementById('fpLink');
  try{
    const d=await api('/auth/forgot-password',{method:'POST',body:JSON.stringify({email:e.target.email.value.trim()})});
    msg.textContent=d.message; msg.style.display='block';
    if(d.resetLink){ link.innerHTML='Demo reset link: <a href="'+d.resetLink+'">'+d.resetLink+'</a>'; } else { link.innerHTML='<small>If you are running locally without a mail provider, set ENABLE_DEMO_RESET=true to display the demo reset link.</small>'; }
  }catch(err){ msg.textContent=err.message; msg.style.display='block'; }
});
</script>
</body>
</html>
