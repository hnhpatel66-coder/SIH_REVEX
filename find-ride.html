<!doctype html>
<html lang="en" data-theme="light">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <script>(function(){try{var s=localStorage.getItem('revexTheme');document.documentElement.setAttribute('data-theme',s==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script><title>Find a Ride | REVEX</title>
  <meta name="description" content="Browse approved REVEX ride offers. Compare vehicle photos, driver details, route, timing, available seats and the full total, then pay and book a seat instantly.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/navbar.css"><link rel="stylesheet" href="css/cards.css"><link rel="stylesheet" href="css/responsive.css"><link rel="stylesheet" href="css/theme.css"><link rel="stylesheet" href="css/revex-ui.css"><link rel="stylesheet" href="css/chat.css">



  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f766e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="REVEX">

</head>
<body>
  <header class="container"><nav class="nav"><a class="brand" href="index.html">REV<span>EX</span></a><button class="menu-btn" aria-label="Open navigation" type="button">Menu</button><div class="nav-links"></div><div class="nav-actions"></div></nav></header>
  <main class="container section">
    <div class="rvx-page-head">
      <div>
        <span class="rvx-eyebrow">RIDE SHARING</span>
        <h1>Find a Ride</h1>
        <p>Only admin-approved ride offers appear here. Every price you see includes the platform fee and any extras, and the same total is what you pay.</p>
      </div>
      <a class="rvx-btn rvx-btn--outline" href="offer-ride.html" data-owner-only>Offer a ride</a>
    </div>

    <form id="rideSearch" class="rvx-card rvx-card--quiet" style="margin-bottom:22px">
      <div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">
        <div class="rvx-field"><span>From</span><input name="from" placeholder="Surat"></div>
        <div class="rvx-field"><span>To</span><input name="to" placeholder="Ahmedabad"></div>
        <div class="rvx-field"><span>Date</span><input name="date" type="date"></div>
        <div class="rvx-field"><span>Vehicle type</span><select name="vehicleType"><option value="">Any</option><option>Car</option><option>Bike</option><option>Scooter</option><option>Other</option></select></div>
      </div>
      <div class="rvx-btnrow">
        <button class="rvx-btn rvx-btn--primary" type="submit">Search rides</button>
        <button class="rvx-btn rvx-btn--ghost" id="rideSearchReset" type="button">Clear</button>
      </div>
    </form>

    <div class="rvx-grid rvx-grid--wide" id="rideResults"></div>
  </main>
  <footer class="footer"><div class="container"><p>© 2026 REVEX · Urban mobility, reimagined.</p></div></footer>
  <script src="js/theme.js"></script>
  <script src="js/confirm-delete.js"></script>
  <script src="js/main.js"></script>
  <script src="js/payment.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/rides.js"></script>
<div class="revex-app-tools" role="region" aria-label="REVEX app options">
  <a class="revex-download-app" href="/downloads/REVEX.apk" download="REVEX.apk">⬇️ Download Android App</a>
  <button class="revex-install-app" type="button" data-revex-install>📲 Install REVEX</button>
</div>
  <script src="/js/install.js" defer></script>
</body></html>
